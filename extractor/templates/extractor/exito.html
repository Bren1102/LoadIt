<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado de Extracción</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Datos Extraídos Correctamente</h2>
        <a href="{% url 'subir_formulario' %}" class="btn btn-outline-secondary">Subir otro</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Resumen del Formulario (JSON)</h5>
        </div>
        <div class="card-body bg-light">
            <pre class="mb-0"><code>{{ datos|dictsort:"identificacion" }}</code></pre>
        </div>
    </div>

    <div class="mt-4 p-3 border rounded bg-white">
        <p><strong>Tip:</strong> Estos datos ya fueron guardados en la base de datos de la App.</p>
    </div>
</body>
</html>
