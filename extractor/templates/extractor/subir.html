<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesamiento de Documentos - LoadIt AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            /* Fondo Lavanda Claro premium uniforme */
            background-color: #f5f3ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 16px;
        }
        /* Forzamos a que los botones primarios usen tu Violeta Corporativo */
        .btn-primary {
            background-color: #4c1d95 !important;
            border-color: #4c1d95 !important;
        }
        .btn-primary:hover {
            background-color: #6d28d9 !important;
            border-color: #6d28d9 !important;
        }
        /* El botón de volver adaptado al fondo claro */
        .btn-outline-light {
            color: #4c1d95 !important;
            border-color: #4c1d95 !important;
        }
        .btn-outline-light:hover {
            background-color: #4c1d95 !important;
            color: #ffffff !important;
        }
        /* Íconos en el tono violeta corporativo */
        .material-icons.text-primary {
            color: #4c1d95 !important;
        }
        .btn {
            border-radius: 8px;
            font-weight: 600;
        }
        .form-control, .form-select {
            border-radius: 8px;
        }
    </style>
</head>
<!-- CORRECCIÓN: Sacamos vh-100 y align-items-center para habilitar el scroll natural y metemos padding arriba y abajo -->
<body class="py-5">

    <div class="container">
        <div class="row justify-content-center">
            <!-- CORRECCIÓN: Le damos un poquito más de ancho para que respiren los inputs -->
            <div class="col-md-10 col-lg-7">
                
                <div class="d-flex justify-content-between align-items-center mb-3 px-1">
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
                        <span class="material-icons" style="font-size: 16px;">arrow_back</span>
                        Volver al Dashboard
                    </a>
                    <span class="text-dark small">Operador: <strong style="color: #4c1d95;">{{ request.user.username }}</strong></span>
                </div>

                <div class="card shadow-lg border-0 bg-white p-4">
                    
                    <div class="text-center mb-4">
                        <div class="d-flex align-items-center justify-content-center gap-2 mb-1">
                            <!-- Icono de buque en rosa/fucsia para unificar branding -->
                            <span class="material-icons" style="font-size: 36px; color: #d946ef;">directions_boat</span>
                            <h3 class="text-dark fw-bold m-0">Consolidación Internacional</h3>
                        </div>
                        <p class="text-secondary small m-0">Cargá toda la documentación de la operación para auditar y machear datos cruzados.</p>
                    </div>

                    <hr class="text-muted mt-0 mb-4">

                    <form method="post" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}
                        
                        <!-- PAÍS DE DESTINO -->
                        <div class="mb-3">
                            <label for="id_pais_destino" class="form-label text-secondary small fw-semibold d-flex align-items-center gap-1">
                                <span class="material-icons text-primary" style="font-size: 16px;">public</span>
                                Aduana / País de Destino
                            </label>
                            <select name="pais_destino" id="id_pais_destino" class="form-select border-secondary-subtle py-2" required>
                                <option value="ARGENTINA" selected>Argentina (SENASA - Validación Local)</option>
                                <option value="BRASIL">Brasil (Receita Federal / MAPA)</option>
                                <option value="URUGUAY">Uruguay (DNA / Trámite VUCE)</option>
                                <option value="CHINA">China (GACC Entry - Calamar/Pescado)</option>
                                <option value="TAILANDIA">Tailandia (Fishery Department)</option>
                                <option value="UNION_EUROPEA">Unión Europea (Modelo FISH-CRUST-HC)</option>
                            </select>
                        </div>

                        <!-- 1. FACTURA PROFORMA -->
                        <div class="mb-3">
                            <label for="id_factura_proforma" class="form-label text-secondary small fw-semibold d-flex align-items-center gap-1">
                                <span class="material-icons text-primary" style="font-size: 16px;">receipt</span>
                                Factura Proforma (Origen)
                            </label>
                            <input type="file" name="factura_proforma" id="id_factura_proforma" class="form-control border-secondary-subtle py-2" accept=".pdf,.doc,.docx" required>
                        </div>

                        <!-- 2. INSTRUCCIONES DE EMBARQUE -->
                        <div class="mb-3">
                            <label for="id_instrucciones_embarque" class="form-label text-secondary small fw-semibold d-flex align-items-center gap-1">
                                <span class="material-icons text-primary" style="font-size: 16px;">explore</span>
                                Instrucciones de Embarque / Destino
                            </label>
                            <input type="file" name="instrucciones_embarque" id="id_instrucciones_embarque" class="form-control border-secondary-subtle py-2" accept=".pdf,.doc,.docx" required>
                        </div>

                        <!-- 3. ETIQUETAS DEL PRODUCTO (MÚLTIPLE) -->
                        <div class="mb-4">
                            <label for="id_etiquetas_producto" class="form-label text-secondary small fw-semibold d-flex align-items-center gap-1">
                                <span class="material-icons text-primary" style="font-size: 16px;">label</span>
                                Etiquetas del Producto (Sin tope de archivos)
                            </label>
                            <input type="file" name="etiquetas_producto" id="id_etiquetas_producto" class="form-control border-secondary-subtle py-2" accept=".pdf,.doc,.docx" multiple required>
                            <div class="form-text text-muted" style="font-size: 11px;">Podés seleccionar varios archivos de etiquetas manteniendo apretado Ctrl o Shift.</div>
                        </div>

                        <!-- BOTÓN DE ENVÍO -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg d-flex align-items-center justify-content-center gap-2 py-2 shadow-sm">
                                <span>Iniciar Auditoría Cruzada con IA</span>
                                <span class="material-icons" style="font-size: 22px;">psychology</span>
                            </button>
                        </div>
                    </form>

                </div>

            </div>
        </div>
    </div>

</body>
</html>
