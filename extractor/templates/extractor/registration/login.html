<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LoadIt AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 16px;
        }
        .btn {
            border-radius: 8px;
            font-weight: 600;
        }
        .form-control {
            border-radius: 8px;
        }
    </style>
</head>
<body class="d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="text-center mb-4">
                    <h2 class="text-light fw-bold d-flex align-items-center justify-content-center gap-2 m-0">
                        <span class="material-icons text-primary" style="font-size: 32px;">local_shipping</span>
                        LOADIT <span class="text-primary">AI</span>
                    </h2>
                    <p class="text-muted small mt-1">Panel de Acceso Profesional</p>
                </div>

                <div class="card shadow-lg border-0 bg-white p-4">
                    <h4 class="text-dark fw-bold mb-3 text-center">Ingresar al Sistema</h4>
                    
                    {% if form.errors %}
                    <div class="alert alert-danger p-2 small text-center" role="alert">
                        Usuario o contraseña incorrectos.
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label text-secondary small fw-semibold">Usuario</label>
                            <input type="text" name="username" id="id_username" class="form-control" placeholder="Ej: bmorrone" required>
                        </div>

                        <div class="mb-4">
                            <label for="id_password" class="form-label text-secondary small fw-semibold">Contraseña</label>
                            <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2 py-2">
                            <span>Ingresar</span>
                            <span class="material-icons" style="font-size: 18px;">login</span>
                        </button>

                        <div class="text-center mt-3">
                            <a href="{% url 'signup' %}" class="text-decoration-none small">¿No tenés cuenta? Registrate como nuevo operador acá</a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
